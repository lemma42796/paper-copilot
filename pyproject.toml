[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-copilot"
version = "0.0.0"
description = "Personal paper reading copilot (local-first)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.0",
    "pydantic>=2.0",
    "structlog>=24.4.0",
    "pymupdf>=1.24.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "mcp>=1.27,<2",
]

[project.scripts]
paper-copilot-mcp = "paper_copilot.mcp.server:main"
paper-copilot-runtime = "paper_copilot.api.runtime:main"
paper-copilot-formula-ocr-helper = "paper_copilot.formula_ocr_helper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_copilot"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.15.11",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
]
formula-ocr = [
    "ftfy==6.3.1",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "tokenizers==0.19.1",
    "wand==0.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
